
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Simple Mapping</title>

    <link rel="stylesheet"
          href="https://js.arcgis.com/4.21/esri/themes/light/main.css">

    <script src="https://js.arcgis.com/4.21/"></script>

    <style>
        html, body, #viewDiv {
            padding: 0;
            margin: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="viewDiv"></div>

    <script>
    require([
        "esri/Map",
        "esri/views/MapView",
        "esri/layers/TileLayer",
        "esri/layers/MapImageLayer"
    ], function(Map, MapView, TileLayer, MapImageLayer) {

        // Define how cities appear
        const CitiesRenderer = {
            type: "simple",
            symbol: {
                type: "simple-marker",
                size: 3,
                color: "red",
                style: "circle",
                outline: {
                    width: 1,
                    color: "red"
                }
            },
            label: "Cities"
        };

        // Create cities map image layer
        const CitiesLayer = new MapImageLayer({
            url: "https://sampleserver6.arcgisonline.com/arcgis/rest/services/USA/MapServer",
            sublayers: [{
                id: 0,
                renderer: CitiesRenderer,
                opacity: 0.4
            }]
        });

        // Create transportation layer
        const TransportationLayer = new TileLayer({
            url: "https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer"
        });

        // Create map with both layers
        const map = new Map({
            basemap: "oceans",
            layers: [TransportationLayer, CitiesLayer]
        });

        // Create map view
        const view = new MapView({
            container: "viewDiv",
            map: map,
            zoom: 10,
            center: [-118.2095, 34.0866]

    // Listen for clicks on the map
    view.on("click", eventHandler);

    // Run this function when clicked
    function eventHandler(event) {
        console.log("You just triggered a 'click' event!");

        alert("You just triggered a 'click' event!");


    });
    </script>


</body>
</html>
